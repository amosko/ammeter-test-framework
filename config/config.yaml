# Ammeter test framework configuration. Command line flags override these values.

ammeters:
  greenlee:
    host: localhost
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    expected_range_a: [0.01, 100]      # 1-10 V over 0.1-100 ohm
  entes:
    host: localhost
    port: 5001
    command: "MEASURE_ENTES -get_data"
    expected_range_a: [5, 200]         # 0.01-0.1 T times a 500-2000 calibration factor
  circutor:
    host: localhost
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement -current"   # the emulator requires "-current"; the original README omitted it
    expected_range_a: [0.001, 0.1]     # 10 samples of 0.1-1 V over 1-10 ms steps

testing:
  sampling:
    measurements_count: 50
    total_duration_seconds: null       # give any two of the three; the third is derived
    sampling_frequency_hz: 10
  connection_timeout_seconds: 2.0
  max_failure_rate: 0.05               # a run fails if more than this fraction of samples fail
  error_simulation:
    failure_rate: 0.0                  # 0.0-1.0, randomly fails samples to exercise error handling
    seed: null

analysis:
  reference_current_a: null            # known reference current, enables accuracy metrics
  visualization:
    enabled: true

result_management:
  directory: results
