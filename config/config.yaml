# Ammeter test framework configuration. Command line flags override these values.

# The emulators create an AF_INET socket, so they serve 127.0.0.1 only. Naming the address rather than
# "localhost" matters on Windows, where localhost resolves to ::1 first and the IPv6 attempt has to
# time out before the client falls back to IPv4 -- two seconds per measurement.
ammeters:
  greenlee:
    host: 127.0.0.1
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    expected_range_a: [0.01, 100]      # 1-10 V over 0.1-100 ohm
  entes:
    host: 127.0.0.1
    port: 5001
    command: "MEASURE_ENTES -get_data"
    expected_range_a: [5, 200]         # 0.01-0.1 T times a 500-2000 calibration factor
  circutor:
    host: 127.0.0.1
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement -current"   # the emulator requires "-current"; the original README omitted it
    expected_range_a: [0.001, 0.1]     # 10 samples of 0.1-1 V over 1-10 ms steps

testing:
  sampling:
    measurements_count: 50
    total_duration_seconds: null       # give any two of the three; the third is derived
    sampling_frequency_hz: 10
  timeout_seconds: 2.0                 # per connect and per reply
  max_failure_rate: 0.05               # a run fails if more than this fraction of samples fail
  max_schedule_error_ms: 10            # or if a sample is taken this late; null disables the check
  retry:
    attempts: 2                        # total attempts per sample, not extra tries; 1 disables retrying
    backoff_seconds: 0.005             # linear: attempt n waits n * backoff; the budget must fit the interval
  error_simulation:
    failure_rate: 0.0                  # 0.0-1.0, randomly fails samples to exercise error handling
    seed: null

analysis:
  reference_current_a: null            # known reference current, enables accuracy metrics; an ammeter entry
                                       # may set its own reference_current_a
  visualization:
    enabled: true

result_management:
  directory: results
