[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"Ammeters/*_Ammeter.py" = ["E501"]  # original emulator code, left untouched

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# Third-party sources are not this codebase's type surface, and their own syntax targets newer Pythons
# than the 3.9 this project checks against: numpy's stubs use PEP 695 type statements and pytest uses
# match. Without this, running mypy on a modern interpreter fails inside a dependency.
module = ["matplotlib.*", "numpy.*", "pytest.*", "_pytest.*"]
follow_imports = "skip"
