[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"Ammeters/*_Ammeter.py" = ["E501"]  # original emulator code, left untouched

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# matplotlib is optional and imported lazily; it drags in numpy, whose stubs use syntax newer than the
# 3.9 target this project checks against. Neither is part of this codebase's own type surface.
module = ["matplotlib.*", "numpy.*"]
follow_imports = "skip"
