[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"Ammeters/*_Ammeter.py" = ["E501"]  # original emulator code; only the Greenlee print string changed

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
# matplotlib is optional and imported lazily; it drags in numpy, whose stubs use PEP 695 type statements
# that the 3.9 target cannot parse. Neither is part of this codebase's own type surface. pytest is not
# listed: skipping it would make @fixture and @parametrize untyped decorators, which --strict rejects.
# mypy therefore runs on 3.9, the version it targets -- see .github/workflows/ci.yml.
module = ["matplotlib.*", "numpy.*"]
follow_imports = "skip"
