name: CI

# "Ensure cross-platform compatibility" is a requirement, so it is tested rather than asserted:
# the suite starts real emulators on real sockets, so a green matrix is evidence the transport,
# the scheduler and the archive work on each OS. 3.9 is the floor the code targets; 3.13 covers
# the branch where Windows gained a high-resolution time.sleep.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy main.py run_tests.py Ammeters src tests examples

  smoke:
    name: end to end / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      # Twice in a row: proves nothing leaks a socket between runs, and that the archive reloads.
      - run: python run_tests.py run --start-emulators
      - run: python run_tests.py run --start-emulators
      - run: python run_tests.py list
      - run: python run_tests.py compare --latest --no-plot

  # TEMPORARY: diagnosing the windows protocol error and the macos schedule error seen in CI.
  diagnose:
    name: diagnose / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: which address does localhost resolve to, and who answers on it
        run: |
          python -c "
          import socket, subprocess, sys, time
          for a in socket.getaddrinfo('localhost', 5000, type=socket.SOCK_STREAM):
              print('resolves to', a[0].name, a[4])
          p = subprocess.Popen([sys.executable, 'main.py'])
          time.sleep(6)
          for fam, _t, _p, _c, addr in socket.getaddrinfo('localhost', 5000, type=socket.SOCK_STREAM):
              s = socket.socket(fam, socket.SOCK_STREAM); s.settimeout(3)
              try:
                  s.connect(addr); s.sendall(b'MEASURE_GREENLEE -get_measurement')
                  print(fam.name, addr, '->', repr(s.recv(1024)[:40]))
              except OSError as e:
                  print(fam.name, addr, 'ERROR', e)
              finally:
                  s.close()
          p.terminate()
          "
      - name: one ammeter alone vs three concurrently
        continue-on-error: true
        run: |
          python run_tests.py run greenlee --start-emulators --no-plot
          python run_tests.py run --start-emulators --no-plot
