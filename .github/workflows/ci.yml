name: CI

# "Ensure cross-platform compatibility" is a requirement, so it is tested rather than asserted: the
# suite starts real emulators on real sockets, so a green matrix is evidence that the transport, the
# scheduler and the archive work on each OS. 3.9 is the floor the code targets; 3.13 covers the other
# side of the sleep-granularity branch in sampling.py.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m mypy main.py run_tests.py Ammeters src tests examples

  smoke:
    name: end to end / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      # A shared runner stalls for tens of milliseconds, so the shipped 10 ms timing criterion is not
      # reachable here and is not what this job tests. config/config.yaml still ships 10 ms, and the
      # criterion is verified deterministically in tests/test_analysis.py; this copy disables it so the
      # end-to-end plumbing is what decides the job.
      - name: config copy without the timing criterion
        shell: bash
        run: |
          sed 's/max_schedule_error_ms: 10/max_schedule_error_ms: null/' config/config.yaml > ci-config.yaml
      # Twice in a row: proves nothing leaks a socket between runs, and that the archive reloads.
      - run: python run_tests.py --config ci-config.yaml run --start-emulators
      - run: python run_tests.py --config ci-config.yaml run --start-emulators
      - run: python run_tests.py --config ci-config.yaml list
      - run: python run_tests.py --config ci-config.yaml compare --latest --no-plot

